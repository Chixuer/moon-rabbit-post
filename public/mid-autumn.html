<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>中秋快乐 🥮</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  /* 黄昏粉（浅色） */
  --sky-1:#f9cdb7; --sky-2:#f3b7c7; --sky-3:#cfb8e8;
  --ink:#4b3550; --ink-soft:#634569;
  --moon:#fff3cf; --moon-glow:rgba(255,236,170,.75);
  --card:rgba(255,255,255,.72); --card-line:rgba(255,255,255,.92);
  --accent:#d65573; --accent-deep:#a93d58; --accent-ink:#fff;
  --gold:#f2b93b;
  --star-o:.5;
  --sheet:#fff8f5;
  --display:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky-1:#171a45; --sky-2:#2d2863; --sky-3:#5a3f7e;
    --ink:#fff4e4; --ink-soft:#dccbea;
    --moon:#ffe9a6; --moon-glow:rgba(255,226,140,.5);
    --card:rgba(34,28,72,.62); --card-line:rgba(255,255,255,.16);
    --accent:#e0607f; --accent-deep:#9e3552; --accent-ink:#fff;
    --star-o:1;
    --sheet:#2a2458;
  }
}
:root[data-theme="dark"]{
  --sky-1:#171a45; --sky-2:#2d2863; --sky-3:#5a3f7e;
  --ink:#fff4e4; --ink-soft:#dccbea;
  --moon:#ffe9a6; --moon-glow:rgba(255,226,140,.5);
  --card:rgba(34,28,72,.62); --card-line:rgba(255,255,255,.16);
  --accent:#e0607f; --accent-deep:#9e3552; --accent-ink:#fff;
  --star-o:1;
  --sheet:#2a2458;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);touch-action:manipulation}
body{
  margin:0;height:100%;overflow:hidden;
  background:var(--sky-2);
  background-image:linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 55%,var(--sky-3) 100%);
  color:var(--ink);font-family:var(--body);
  -webkit-tap-highlight-color:transparent;
}
.stage{position:relative;height:100%;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}

/* ---------- 天空 ---------- */
.stars{position:absolute;inset:0;pointer-events:none;opacity:var(--star-o);transition:opacity .6s}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d) ease-in-out var(--delay) infinite}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}

.moon{
  position:absolute;z-index:0;
  top:clamp(18px,5vh,48px);right:clamp(18px,7vw,64px);
  width:clamp(84px,24vw,150px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fffdf3 0%,var(--moon) 55%,#f3d58a 100%);
  box-shadow:0 0 40px 10px var(--moon-glow),0 0 120px 40px var(--moon-glow);
  transition:box-shadow 1.2s ease,transform 1.2s ease;
}
.moon::before,.moon::after{content:"";position:absolute;border-radius:50%;background:rgba(214,176,100,.22)}
.moon::before{width:18%;height:18%;top:26%;left:58%}
.moon::after{width:12%;height:12%;top:58%;left:30%}
.moon.glow{box-shadow:0 0 70px 26px var(--moon-glow),0 0 200px 90px var(--moon-glow);transform:scale(1.07)}

/* ---------- 小兔子 ---------- */
.bunny{
  position:absolute;z-index:1;left:clamp(10px,4vw,40px);bottom:6px;
  width:clamp(72px,20vw,104px);aspect-ratio:1;pointer-events:none;user-select:none;
  animation:bob 3.4s ease-in-out infinite;
}
.bunny svg{display:block;width:100%;height:100%;overflow:visible;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.ear{transform-box:fill-box;transform-origin:50% 90%}
.ear-l{animation:earL 5s ease-in-out infinite}
.ear-r{animation:earR 5s ease-in-out 1.3s infinite}
@keyframes earL{0%,78%,100%{transform:rotate(0)}84%{transform:rotate(-9deg)}90%{transform:rotate(4deg)}}
@keyframes earR{0%,78%,100%{transform:rotate(0)}84%{transform:rotate(9deg)}90%{transform:rotate(-4deg)}}
.eyes-happy{display:none}
.bunny.happy .eyes-open{display:none}
.bunny.happy .eyes-happy{display:inline}

/* ---------- 特效层 ---------- */
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.fx-back{z-index:1}
.fx-front{z-index:4}
.petal{position:absolute;top:0;color:var(--gold);line-height:1;text-shadow:0 0 6px rgba(255,210,120,.6)}
.crumb{position:absolute;border-radius:40%}
.lantern{position:absolute;width:44px;height:56px}
.lan-body{
  width:100%;height:100%;
  border-radius:46% 46% 20% 20% / 56% 56% 22% 22%;
  background:linear-gradient(180deg,#ffe19a 0%,#ff9d5c 68%,#f0703f 100%);
  box-shadow:0 0 18px 6px rgba(255,170,90,.55),0 0 60px 18px rgba(255,150,70,.3);
  position:relative;
}
.lan-body::after{content:"";position:absolute;left:50%;bottom:4px;width:10px;height:7px;margin-left:-5px;border-radius:50%;background:#fff6c2;box-shadow:0 0 8px 3px rgba(255,240,170,.9)}
.lantern.mini{width:22px;height:28px}
.lantern.mini .lan-body::after{width:5px;height:4px;margin-left:-2.5px;bottom:2px}
.lan-tag{
  position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:8px;
  white-space:nowrap;font-size:13px;padding:3px 10px;border-radius:12px;
  background:var(--card);color:var(--ink);border:1px solid var(--card-line);
}

/* ---------- 页面 ---------- */
.screen{
  position:absolute;inset:0;z-index:2;
  display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:clamp(120px,21vh,200px) 22px 112px;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  opacity:0;visibility:hidden;transform:scale(.985);
  transition:opacity .45s cubic-bezier(.4,0,.2,1),transform .45s cubic-bezier(.4,0,.2,1),visibility 0s linear .45s;
}
.screen.active{
  opacity:1;visibility:visible;transform:none;
  transition:opacity .7s cubic-bezier(.22,1,.36,1) .12s,transform .7s cubic-bezier(.22,1,.36,1) .12s,visibility 0s;
}
.inner{margin:auto 0;width:100%;max-width:420px}

.title{font-family:var(--display);font-weight:400;font-size:clamp(26px,7.4vw,36px);line-height:1.4;margin:0 0 12px;letter-spacing:.02em}
.title.sm{font-size:clamp(22px,6vw,28px)}
.hint,.from{margin:0 0 20px;color:var(--ink-soft);font-size:15px;line-height:1.6}
.from{margin-bottom:28px}

.btn{
  appearance:none;border:0;cursor:pointer;touch-action:manipulation;
  font-family:var(--display);font-size:19px;letter-spacing:.04em;
  color:var(--accent-ink);background:var(--accent);
  padding:12px 30px;min-height:48px;border-radius:999px;
  box-shadow:0 5px 0 var(--accent-deep),0 10px 24px rgba(160,60,90,.22);
  transition:transform .12s ease,box-shadow .12s ease;
}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--accent-deep),0 6px 14px rgba(160,60,90,.2)}
.btn:disabled{cursor:default}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--card-line);box-shadow:0 4px 0 rgba(120,70,110,.16);font-size:17px;padding:10px 22px}
.btn.ghost:active{box-shadow:0 1px 0 rgba(120,70,110,.16)}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:4px}

/* 邮戳 & 签收章 */
.mark{position:relative;width:84px;height:84px;margin:0 auto 22px}
.postmark{
  position:absolute;inset:0;border:2px dashed var(--accent);border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--accent);font-family:var(--display);transform:rotate(-10deg);
}
.postmark span{font-size:24px;line-height:1}
.postmark small{font-size:11px;margin-top:4px;letter-spacing:.06em}
.stamp{
  position:absolute;top:50%;left:50%;white-space:nowrap;pointer-events:none;
  font-family:var(--display);font-size:22px;color:var(--accent);
  border:3px solid var(--accent);border-radius:8px;padding:2px 10px;
  transform:translate(-50%,-50%) rotate(14deg) scale(2.4);opacity:0;
}
.stamp.on{animation:stampIn .38s cubic-bezier(.2,.9,.3,1.4) forwards}
@keyframes stampIn{to{transform:translate(-50%,-50%) rotate(14deg) scale(1);opacity:.92}}

/* 月饼 */
.cake-wrap{position:relative;width:clamp(170px,54vw,230px);aspect-ratio:1;margin:0 auto}
.cake-btn{
  position:absolute;inset:0;border:0;padding:0;background:none;cursor:pointer;border-radius:50%;
  user-select:none;touch-action:manipulation;
  filter:drop-shadow(0 12px 18px rgba(140,70,30,.25));
}
.cake-btn svg{display:block;width:100%;height:100%;transform-origin:50% 50%}
.paper{
  position:absolute;inset:0;margin:auto;width:96px;height:68px;border:0;cursor:pointer;
  border-radius:6px;background:linear-gradient(135deg,#fffdf6,#ffeed6);
  box-shadow:0 10px 22px rgba(120,60,40,.2);transform:rotate(-7deg);
}
.paper::before{content:"";position:absolute;left:10px;right:10px;top:50%;border-top:1px dashed rgba(168,95,36,.4)}
.paper span{position:relative;font-size:24px}
.dots{display:flex;gap:10px;justify-content:center;margin-top:16px}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--accent);transition:background .3s,transform .3s}
.dots i.on{background:var(--accent);transform:scale(1.15)}
.wish-line{min-height:3.6em;margin:14px auto 10px;max-width:16em;font-family:var(--display);font-size:18px;line-height:1.7}

/* 小纸条 */
.note{
  position:relative;max-width:360px;margin:0 auto 26px;padding:36px 24px 22px;
  background:var(--card);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1.5px solid var(--card-line);border-radius:24px;
  box-shadow:0 14px 40px rgba(90,50,90,.14);
}
.tape{
  position:absolute;top:-12px;left:50%;width:96px;height:24px;border-radius:3px;
  transform:translateX(-50%) rotate(-3deg);transform-origin:20% 50%;
  background:repeating-linear-gradient(45deg,rgba(236,122,146,.6) 0 8px,rgba(255,255,255,.55) 8px 16px);
}
.note p{margin:0 0 14px;font-size:16px;line-height:1.9}
.note .sign{margin:8px 0 0;text-align:right;color:var(--ink-soft);font-size:14px}

/* 许愿 */
.wish-form{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:340px;margin:0 auto}
.wish-form input{
  width:100%;font:inherit;font-size:16px;text-align:center;color:var(--ink);
  background:var(--card);border:1.5px solid var(--card-line);border-radius:16px;padding:12px 14px;
}
.wish-form input::placeholder{color:var(--ink-soft);opacity:.75}
.after{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.tiny{margin:24px 0 0;font-size:13px;color:var(--ink-soft)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}


/* 回访 */
.keep{margin:-16px 0 26px;color:var(--ink-soft);font-size:15px;line-height:1.6}
.keep b{font-weight:400;font-family:var(--display);color:var(--accent);font-size:19px;margin:0 2px}
.link{
  appearance:none;border:0;background:none;cursor:pointer;touch-action:manipulation;
  display:block;margin:14px auto 0;padding:8px 6px;font:inherit;font-size:14px;color:var(--ink-soft);
  text-decoration:underline;text-underline-offset:4px;text-decoration-color:rgba(140,100,145,.45);
}

/* 许愿方式 */
.mode{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--card);border:1.5px solid var(--card-line)}
.mode button{
  appearance:none;border:0;cursor:pointer;touch-action:manipulation;
  font-family:var(--display);font-size:16px;padding:8px 18px;border-radius:999px;
  background:transparent;color:var(--ink-soft);transition:background .2s,color .2s;
}
.mode button[aria-checked="true"]{background:var(--accent);color:var(--accent-ink)}
.mode-note{margin:-6px 0 2px;font-size:13px;line-height:1.6;color:var(--ink-soft);max-width:20em}

/* 取件码 */
.code-card{margin:18px auto 0;max-width:320px;padding:16px 18px 14px;border-radius:18px;background:var(--card);border:1.5px dashed var(--accent)}
.code-card p{margin:0;font-size:14px;color:var(--ink-soft)}
.code-num{display:block;margin:6px 0 12px;font-family:var(--display);font-size:26px;letter-spacing:.06em;color:var(--ink);-webkit-user-select:all;user-select:all}
.code-card small{display:block;margin-top:12px;font-size:12.5px;line-height:1.6;color:var(--ink-soft)}
.code-actions{display:flex;gap:10px;justify-content:center}
.btn.sm{font-size:15px;padding:6px 18px;min-height:38px}
.recover{display:flex;flex-direction:column;align-items:center;gap:12px;margin:14px auto 0;max-width:300px}
.recover input{
  width:100%;font:inherit;font-size:18px;letter-spacing:.08em;text-align:center;color:var(--ink);
  background:var(--card);border:1.5px solid var(--card-line);border-radius:16px;padding:10px 14px;
}
.msg{margin:10px 0 0;font-size:13px;line-height:1.6;color:var(--ink-soft)}

/* 月亮旁边挂着的灯 */
.hang-layer{
  position:fixed;inset:0;z-index:3;pointer-events:none;
  opacity:0;visibility:hidden;transition:opacity .6s ease,visibility 0s linear .6s;
}
.hang-layer.show{opacity:1;visibility:visible;transition:opacity .6s ease .2s,visibility 0s}
.hang{
  position:absolute;width:40px;height:52px;margin:-30px 0 0 -20px;padding:0;border:0;background:none;
  cursor:pointer;pointer-events:auto;touch-action:manipulation;transform-origin:50% 0;
  animation:sway var(--sd,4s) ease-in-out var(--sdl,0s) infinite;
  transition:left .7s ease,top .7s ease;
}
.hang::before{content:"";position:absolute;left:50%;top:0;width:1px;height:14px;background:rgba(255,226,170,.85)}
.hang .lan-body{position:absolute;display:block;left:7px;top:14px;width:26px;height:33px}
.hang .lan-body::after{width:6px;height:4px;margin-left:-3px;bottom:3px}
.hang.pop{animation:hangIn .5s ease-out,sway var(--sd,4s) ease-in-out .5s infinite}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes hangIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:rotate(-4deg)}}
.bubble{
  position:fixed;z-index:5;width:max-content;max-width:min(240px,76vw);padding:10px 14px;border-radius:14px;
  background:var(--card);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border:1.5px solid var(--card-line);color:var(--ink);font-size:15px;line-height:1.6;text-align:left;
  box-shadow:0 10px 26px rgba(90,50,90,.18);word-break:break-word;
}
.bubble small{display:block;margin-top:4px;font-size:12px;color:var(--ink-soft)}
#s-wish.has-hang{padding-top:clamp(210px,33vh,300px)}

/* 心愿小册 */
.sheet-wrap{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(40,22,52,.4)}
.sheet{
  width:100%;max-width:360px;max-height:72%;overflow-y:auto;padding:24px 20px 18px;border-radius:22px;
  background:var(--sheet);color:var(--ink);text-align:center;box-shadow:0 20px 50px rgba(40,20,50,.3);
}
.sheet ol{list-style:none;margin:6px 0 18px;padding:0;text-align:left}
.sheet li{padding:10px 2px;border-bottom:1px dashed rgba(168,95,120,.3);font-size:15px;line-height:1.6;word-break:break-word}
.sheet li:last-child{border-bottom:0}
.sheet li small{display:block;font-size:12px;color:var(--ink-soft)}

/* ================= 彩蛋 & 微动效 ================= */
/* 月亮：慢慢呼吸的光晕 + 会笑的脸 */
.moon-halo{
  position:absolute;z-index:0;pointer-events:none;
  top:clamp(18px,5vh,48px);right:clamp(18px,7vw,64px);
  width:clamp(84px,24vw,150px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,var(--moon-glow) 0%,rgba(255,236,170,0) 68%);
  animation:halo 7s ease-in-out infinite;
}
@keyframes halo{0%,100%{opacity:.45;transform:scale(2.05)}50%{opacity:.85;transform:scale(2.35)}}
.moon::before,.moon::after{transition:opacity .4s ease}
.moon.smile::before,.moon.smile::after{opacity:0}
.moon-face{position:absolute;inset:0;opacity:0;transition:opacity .45s ease;pointer-events:none}
.moon.smile .moon-face{opacity:1}
.moon-face .me{position:absolute;top:40%;width:15%;height:9%;border:2px solid rgba(150,100,50,.62);border-bottom:0;border-radius:50% 50% 0 0}
.moon-face .me.l{left:26%}
.moon-face .me.r{left:59%}
.moon-face .mm{position:absolute;left:38%;top:57%;width:24%;height:12%;border:2px solid rgba(150,100,50,.62);border-top:0;border-radius:0 0 50% 50%}
.moon-face .mm::before,.moon-face .mm::after{content:"";position:absolute;top:-6px;width:9px;height:6px;border-radius:50%;background:rgba(255,160,170,.55)}
.moon-face .mm::before{left:-58%}
.moon-face .mm::after{right:-58%}

/* 小兔子：眨眼、脸红、睡觉、说话 */
.bunny .eyes-open{transform-box:fill-box;transform-origin:50% 60%;transition:transform .09s ease}
.bunny.blink .eyes-open{transform:scaleY(.12)}
.bunny .cheek{transform-box:fill-box;transform-origin:center;transition:transform .3s ease,opacity .3s ease}
.bunny.blush .cheek{transform:scale(1.3);opacity:1}
.eyes-sleep{display:none}
.bunny.sleep .eyes-open,.bunny.sleep .eyes-happy{display:none}
.bunny.sleep .eyes-sleep{display:inline}
.bunny.sleep{animation-duration:5.5s}
.say{
  position:absolute;left:62%;bottom:88%;z-index:2;white-space:nowrap;pointer-events:none;
  font-family:var(--display);font-size:14px;line-height:1.3;color:var(--ink);
  background:var(--sheet);border-radius:14px 14px 14px 4px;padding:6px 11px;
  box-shadow:0 6px 16px rgba(90,50,90,.16);
  opacity:0;transform:translateY(6px) scale(.9);transform-origin:0 100%;
  transition:opacity .22s ease,transform .3s cubic-bezier(.3,1.5,.5,1);
}
.say.show{opacity:1;transform:none}
.float-fx{position:absolute;pointer-events:none;line-height:1;font-family:var(--display)}

/* 流星（偶尔划过） */
.shoot{
  position:absolute;width:90px;height:2px;border-radius:2px;transform-origin:100% 50%;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.95));
  box-shadow:0 0 6px rgba(255,255,255,.7);
}

/* 灯芯微微跳动 */
.lan-body::after{animation:flicker 2.3s ease-in-out infinite}
@keyframes flicker{0%,100%{opacity:1;transform:scale(1)}30%{opacity:.78;transform:scale(.88)}55%{opacity:1;transform:scale(1.08)}80%{opacity:.88;transform:scale(.96)}}

/* 月饼在等你咬 */
.cake-btn.idle{animation:cakeIdle 4.2s ease-in-out 1.2s infinite}
@keyframes cakeIdle{0%,76%,100%{transform:rotate(0)}82%{transform:rotate(-3deg)}88%{transform:rotate(2.5deg)}94%{transform:rotate(-1deg)}}
.dots i.on{animation:dotPop .42s cubic-bezier(.3,1.7,.5,1)}
@keyframes dotPop{0%{transform:scale(.4)}100%{transform:scale(1.15)}}

/* 小纸条：一行一行展开 */
.screen.entering .note > :not(.tape){animation:unfold .7s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(var(--j,0) * 170ms + 260ms)}
.screen.entering .note{animation:noteIn .6s cubic-bezier(.22,1,.36,1) .1s backwards}
@keyframes unfold{from{opacity:0;transform:translateY(8px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
@keyframes noteIn{from{opacity:0;transform:translateY(14px) rotate(-1.2deg)}to{opacity:1;transform:none}}

/* 气泡、小册、取件码出现得更轻 */
.bubble{animation:popIn .26s cubic-bezier(.3,1.4,.5,1)}
.sheet{animation:popIn .36s cubic-bezier(.22,1,.36,1)}
.code-card{animation:popIn .4s cubic-bezier(.3,1.4,.5,1)}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion: reduce){
  .bunny,.ear-l,.ear-r,.star,.hang,.hang.pop,.moon-halo,.lan-body::after,.cake-btn.idle,.dots i.on,
  .bubble,.sheet,.code-card,.screen.entering .note,.screen.entering .note > :not(.tape){animation:none}
  .screen,.screen.active{transition:opacity .2s linear,visibility 0s}
  .screen{transform:none}
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="stars" id="stars" aria-hidden="true"></div>
  <div class="moon-halo" aria-hidden="true"></div>
  <div class="moon" id="moon" aria-hidden="true"><span class="moon-face"><i class="me l"></i><i class="me r"></i><i class="mm"></i></span></div>

  <div class="bunny" id="bunny" aria-hidden="true">
    <svg id="bunny-svg" viewBox="0 0 120 120">
      <g class="ear ear-l"><ellipse cx="44" cy="34" rx="11" ry="28" fill="#fff" stroke="#ecd8e4" stroke-width="2"/><ellipse cx="44" cy="37" rx="5" ry="18" fill="#ffc2cf"/></g>
      <g class="ear ear-r"><ellipse cx="76" cy="34" rx="11" ry="28" fill="#fff" stroke="#ecd8e4" stroke-width="2"/><ellipse cx="76" cy="37" rx="5" ry="18" fill="#ffc2cf"/></g>
      <ellipse cx="60" cy="84" rx="40" ry="31" fill="#fff" stroke="#ecd8e4" stroke-width="2"/>
      <g class="eyes-open">
        <ellipse cx="46" cy="80" rx="3.6" ry="4.4" fill="#4b3550"/><ellipse cx="74" cy="80" rx="3.6" ry="4.4" fill="#4b3550"/>
        <circle cx="47.2" cy="78.6" r="1.2" fill="#fff"/><circle cx="75.2" cy="78.6" r="1.2" fill="#fff"/>
      </g>
      <g class="eyes-happy" fill="none" stroke="#4b3550" stroke-width="2.6" stroke-linecap="round">
        <path d="M41 82 q5 -6 10 0"/><path d="M69 82 q5 -6 10 0"/>
      </g>
      <g class="eyes-sleep" fill="none" stroke="#4b3550" stroke-width="2.4" stroke-linecap="round">
        <path d="M41 79 q5 4 10 0"/><path d="M69 79 q5 4 10 0"/>
      </g>
      <ellipse class="cheek" cx="37" cy="90" rx="6.5" ry="4" fill="#ffb3c1" opacity=".85"/>
      <ellipse class="cheek" cx="83" cy="90" rx="6.5" ry="4" fill="#ffb3c1" opacity=".85"/>
      <path d="M55 88 q2.5 3 5 0 q2.5 3 5 0" fill="none" stroke="#4b3550" stroke-width="2" stroke-linecap="round"/>
      <circle cx="60" cy="108" r="9" fill="#e7a24f" stroke="#b86f2c" stroke-width="1.5"/>
      <ellipse cx="49" cy="106" rx="7" ry="5.5" fill="#fff" stroke="#ecd8e4" stroke-width="2"/>
      <ellipse cx="71" cy="106" rx="7" ry="5.5" fill="#fff" stroke="#ecd8e4" stroke-width="2"/>
    </svg>
    <div class="say" id="bunny-say"></div>
  </div>

  <div class="fx fx-back" id="fx-back" aria-hidden="true"></div>

  <!-- 1. 签收 -->
  <section class="screen active" id="s-intro">
    <div class="inner">
      <div class="mark" aria-hidden="true">
        <div class="postmark"><span>中秋</span><small id="pm-small">2026.9.25</small></div>
        <div class="stamp" id="stamp">已签收</div>
      </div>
      <h1 class="title">叮咚～<br><span id="intro-to"></span>你有一份月光待签收</h1>
      <p class="from">寄件人：<span data-from></span></p>
      <p class="keep" id="keep" hidden>小兔子还替你保管着<b id="keep-n">0</b>个心愿</p>
      <button class="btn" id="btn-sign">签收一下</button>
      <button class="link" id="btn-skip" hidden>直接去看心愿</button>
    </div>
  </section>

  <!-- 2. 咬月饼 -->
  <section class="screen" id="s-cake">
    <div class="inner">
      <h2 class="title sm">给你留了一块月饼</h2>
      <p class="hint" id="cake-hint">点一下月饼，咬一口试试</p>
      <div class="cake-wrap">
        <button class="cake-btn idle" id="cake" aria-label="咬一口月饼">
          <svg id="cake-svg" viewBox="0 0 220 220" aria-hidden="true">
            <defs>
              <mask id="bite-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="220" height="220">
                <rect width="220" height="220" fill="#fff"/>
                <g id="bite-holes"></g>
              </mask>
              <radialGradient id="cake-grad" cx="40%" cy="35%" r="72%">
                <stop offset="0" stop-color="#f6c77c"/><stop offset="1" stop-color="#d98d3e"/>
              </radialGradient>
            </defs>
            <g mask="url(#bite-mask)">
              <path id="cake-edge" fill="url(#cake-grad)" stroke="#b86f2c" stroke-width="2.5" stroke-linejoin="round"/>
              <circle cx="110" cy="110" r="64" fill="#f3b865" stroke="rgba(168,95,36,.5)" stroke-width="2"/>
              <circle cx="110" cy="110" r="54" fill="none" stroke="rgba(168,95,36,.38)" stroke-width="2" stroke-dasharray="4 6"/>
              <text x="110" y="122" text-anchor="middle" font-size="34" fill="#a85f24" style="font-family:var(--display)">中秋</text>
              <ellipse cx="74" cy="66" rx="20" ry="8" fill="#fff" opacity=".22" transform="rotate(-32 74 66)"/>
            </g>
          </svg>
        </button>
        <button class="paper" id="paper" hidden aria-label="展开小纸条"><span aria-hidden="true">🌙</span></button>
      </div>
      <div class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <p class="wish-line" id="wish-line" aria-live="polite"></p>
      <button class="btn" id="btn-open" hidden>展开小纸条</button>
    </div>
  </section>

  <!-- 3. 小纸条 -->
  <section class="screen" id="s-note">
    <div class="inner">
      <article class="note">
        <span class="tape" id="tape" aria-hidden="true"></span>
        <h2 class="title sm">中秋快乐呀</h2>
        <p>今晚的月亮很圆，<br>想到你，就想来说一声。</p>
        <p>不管最近过得怎么样，<br>都希望你好好吃饭、好好睡觉，<br>被喜欢的事和人包围着。</p>
        <p>不用特地回我哦，<br>这份月光，收下就好啦。</p>
        <p class="sign">—— <span data-from></span></p>
      </article>
      <button class="btn" id="btn-lantern">去放一盏孔明灯</button>
    </div>
  </section>

  <!-- 4. 孔明灯 -->
  <section class="screen" id="s-wish">
    <div class="inner">
      <h2 class="title sm" id="wish-title">写一个小心愿吧</h2>
      <p class="hint" id="wish-sub">它会跟着孔明灯飞到月亮上，不写也可以</p>
      <div class="wish-form" id="wish-form">
        <label class="sr-only" for="wish">小心愿</label>
        <input id="wish" maxlength="24" placeholder="比如：希望一切都顺顺利利" autocomplete="off" enterkeyhint="send">
        <div class="mode" id="mode" role="radiogroup" aria-label="心愿存放方式">
          <button type="button" role="radio" aria-checked="true" data-mode="local">悄悄许愿</button>
          <button type="button" role="radio" aria-checked="false" data-mode="cloud">寄到月亮</button>
        </div>
        <p class="mode-note" id="mode-note"></p>
        <button class="btn" id="btn-fly">放飞孔明灯</button>
      </div>
      <div class="after" id="after" hidden>
        <button class="btn ghost" id="btn-again">再放一盏</button>
        <button class="btn ghost" id="btn-restart">从头再看一遍</button>
      </div>
      <p class="msg" id="up-note" hidden></p>
      <div class="code-card" id="code-card" hidden>
        <p>你的心愿取件码</p>
        <strong class="code-num" id="code-num"></strong>
        <div class="code-actions">
          <button class="btn ghost sm" id="btn-copy">复制</button>
          <button class="btn ghost sm" id="btn-code-hide">收起</button>
        </div>
        <small>换手机时输入它，就能找回「寄到月亮」的心愿，像密码一样收好哦</small>
      </div>
      <button class="link" id="btn-book" hidden></button>
      <button class="link" id="btn-mycode" hidden>我的取件码</button>
      <button class="link" id="btn-recover" hidden>换手机了？输入取件码，找回之前的心愿</button>
      <div class="recover" id="recover" hidden>
        <label class="sr-only" for="code-input">心愿取件码</label>
        <input id="code-input" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="12 位数字取件码">
        <button class="btn ghost sm" id="btn-fetch">找回心愿</button>
      </div>
      <p class="msg" id="recover-msg" hidden></p>
      <p class="msg" id="net-note" hidden>月亮这会儿信号不太好，先看这台手机上的心愿</p>
      <p class="tiny">点点天空，也会飞起小灯笼哦</p>
    </div>
  </section>

  <div class="hang-layer" id="hang-layer"></div>
  <div class="sheet-wrap" id="sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <h3 class="title sm" id="sheet-title">心愿小册</h3>
      <ol id="sheet-list"></ol>
      <button class="btn ghost sm" id="btn-sheet-close">合上小册</button>
    </div>
  </div>

  <div class="fx fx-front" id="fx-front" aria-hidden="true"></div>
</div>

<script>
(() => {
  /* 想写名字就改这里 */
  const CONFIG = { to: "", from: "月亮旁边的小兔子" };
  /* Supabase（公开密钥，本来就会出现在网页里；数据安全靠数据库里的函数和权限） */
  const SUPA = {
    url: "https://dpbinyldftwdwwwwxqby.supabase.co",
    keys: [
      "sb_publishable_ZhOItXRiaKmkLZMCYwvwlw_XtpMxCgH",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRwYmlueWxkZnR3ZHd3d3d4cWJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2MjI3MDQsImV4cCI6MjA5ODE5ODcwNH0.A6lN75ayzIZ7PyP4dYP3J-yCAyq-UjpdnYyoS1gDRF4"
    ]
  };
  const CLOUD = /^https:\/\//.test(SUPA.url) && SUPA.keys.length > 0;
  let keyIdx = 0;

  try {
    const q = new URLSearchParams(location.search);
    if (q.get("to")) CONFIG.to = q.get("to").slice(0, 12);
    if (q.get("from")) CONFIG.from = q.get("from").slice(0, 16);
  } catch (e) {}

  const $ = s => document.querySelector(s);
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const stage = $("#stage"), fxBack = $("#fx-back"), fxFront = $("#fx-front");
  const moon = $("#moon"), bunny = $("#bunny"), bunnySvg = $("#bunny-svg");

  document.querySelectorAll("[data-from]").forEach(el => (el.textContent = CONFIG.from));
  if (CONFIG.to) $("#intro-to").textContent = CONFIG.to + "，";

  /* ---------- 本地存储（只在这台手机里） ---------- */
  const KEY = "moon-rabbit-post:v1";
  const fresh = () => ({ v: 1, signed: 0, code: null, wishes: [], lastLines: null, mode: "local", showCode: false });
  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(KEY) || "null");
      if (raw && typeof raw === "object") {
        const st = Object.assign(fresh(), raw);
        st.wishes = Array.isArray(st.wishes)
          ? st.wishes.filter(w => w && typeof w.content === "string" && w.content && typeof w.lid === "string")
          : [];
        if (st.code && !/^\d{12}$/.test(st.code)) st.code = null;
        if (st.mode !== "cloud") st.mode = "local";
        return st;
      }
    } catch (e) {}
    return fresh();
  }
  const state = load();
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }
  const time = w => Date.parse(w.at) || 0;
  const newestFirst = () => [...state.wishes].sort((a, b) => time(b) - time(a));
  const fmtDate = iso => {
    const d = new Date(iso);
    return isNaN(d) ? "" : `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}`;
  };
  const fmtCode = c => (c || "").replace(/(\d{4})(?=\d)/g, "$1-");

  /* ---------- 和月亮（Supabase）通信 ---------- */
  async function rpc(fn, args) {
    if (!CLOUD) throw new Error("no_cloud");
    for (;;) {
      const key = SUPA.keys[keyIdx];
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 9000);
      const headers = { "Content-Type": "application/json", apikey: key };
      if (!key.startsWith("sb_")) headers.Authorization = "Bearer " + key;
      let r;
      try {
        r = await fetch(`${SUPA.url}/rest/v1/rpc/${fn}`, {
          method: "POST", headers, body: JSON.stringify(args || {}), signal: ctrl.signal
        });
      } finally {
        clearTimeout(timer);
      }
      if ((r.status === 401 || r.status === 403) && keyIdx < SUPA.keys.length - 1) { keyIdx++; continue; }
      if (!r.ok) throw new Error("http_" + r.status);
      const data = await r.json();
      if (!data || typeof data !== "object") throw new Error("bad_response");
      return data;
    }
  }
  let codeJob = null;
  function ensureCode() {
    if (state.code) return Promise.resolve(state.code);
    if (!codeJob) {
      codeJob = rpc("mrp_create_box").then(res => {
        if (!res.ok || !/^\d{12}$/.test(res.code || "")) throw new Error(res.error || "create_failed");
        state.code = res.code;
        state.showCode = true;
        save();
        return res.code;
      }).finally(() => { codeJob = null; });
    }
    return codeJob;
  }
  let flushing = null;
  function flush() {
    if (!flushing) {
      flushing = (async () => {
        const pending = state.wishes.filter(w => !w.priv && !w.sid);
        if (!pending.length) return true;
        await ensureCode();
        for (const w of pending) {
          const res = await rpc("mrp_add_wish", { p_code: state.code, p_content: w.content });
          if (res.ok && res.wish) { w.sid = res.wish.id; save(); }
          else if (res.error === "invalid_content") { w.priv = true; save(); }
          else return false;
        }
        return true;
      })().finally(() => { flushing = null; });
    }
    return flushing;
  }
  function merge(list) {
    const known = new Set(state.wishes.filter(w => w.sid != null).map(w => String(w.sid)));
    let added = 0;
    (list || []).forEach(s => {
      if (!s || known.has(String(s.id)) || typeof s.content !== "string") return;
      state.wishes.push({ lid: "s" + s.id, sid: s.id, content: s.content, at: s.created_at, priv: false });
      added++;
    });
    if (added) save();
    return added;
  }

  /* 星星 */
  const stars = $("#stars");
  for (let i = 0; i < 46; i++) {
    const s = document.createElement("i");
    const size = (Math.random() * 2 + 1).toFixed(1);
    s.className = "star";
    s.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 62}%;width:${size}px;height:${size}px;--d:${(Math.random() * 3 + 2).toFixed(2)}s;--delay:${(-Math.random() * 5).toFixed(2)}s`;
    stars.appendChild(s);
  }

  /* 月饼花边 */
  function scallop(cx, cy, R, n, r) {
    let d = "";
    for (let k = 0; k <= n; k++) {
      const a = (k / n) * Math.PI * 2 - Math.PI / 2;
      const x = (cx + R * Math.cos(a)).toFixed(2), y = (cy + R * Math.sin(a)).toFixed(2);
      d += k === 0 ? `M${x} ${y}` : ` A${r} ${r} 0 0 1 ${x} ${y}`;
    }
    return d + " Z";
  }
  $("#cake-edge").setAttribute("d", scallop(110, 110, 84, 12, 23));

  /* 小工具 */
  let happyT;
  function happy() {
    bunny.classList.add("happy");
    clearTimeout(happyT);
    happyT = setTimeout(() => bunny.classList.remove("happy"), 1100);
    if (!reduce) hop(14);
  }
  function hop(h) {
    return bunnySvg.animate(
      [
        { transform: "translateY(0) scale(1,1)" },
        { transform: "translateY(0) scale(1.1,.88)", offset: 0.16 },
        { transform: `translateY(${-h}px) scale(.94,1.08)`, offset: 0.45 },
        { transform: "translateY(0) scale(1.07,.93)", offset: 0.78 },
        { transform: "translateY(0) scale(1,1)" }
      ],
      { duration: 520, easing: "cubic-bezier(.3,.7,.4,1)" }
    );
  }
  const hangLayer = $("#hang-layer");
  let enterT;
  function go(id) {
    document.querySelectorAll(".screen").forEach(s => {
      s.classList.toggle("active", s.id === id);
      s.classList.toggle("entering", s.id === id);
    });
    clearTimeout(enterT);
    enterT = setTimeout(() => $("#" + id).classList.remove("entering"), 1800);
    $("#" + id).scrollTop = 0;
    closeBubble();
    if (id === "s-wish") enterWish();
    hangLayer.classList.toggle("show", id === "s-wish");
  }
  function crumbs(x, y, n = 8, spread = 60) {
    const colors = ["#e7a24f", "#d98d3e", "#b86f2c", "#f3b865"];
    for (let i = 0; i < n; i++) {
      const c = document.createElement("span");
      const s = 3 + Math.random() * 5;
      c.className = "crumb";
      c.style.cssText = `width:${s}px;height:${s}px;left:${x - s / 2}px;top:${y - s / 2}px;background:${colors[i % 4]}`;
      fxFront.appendChild(c);
      const ang = Math.random() * Math.PI * 2, dist = spread * (0.4 + Math.random() * 0.8);
      const dx = Math.cos(ang) * dist, up = -(8 + Math.random() * 26), fall = 36 + Math.random() * 34;
      const spin = (Math.random() - 0.5) * 540;
      const a = c.animate(
        [
          { transform: "translate(0px,0px) rotate(0deg)", opacity: 1 },
          { transform: `translate(${dx * 0.55}px,${up + Math.sin(ang) * dist * 0.3}px) rotate(${spin * 0.4}deg)`, opacity: 1, offset: 0.35 },
          { transform: `translate(${dx}px,${fall + Math.sin(ang) * dist * 0.4}px) rotate(${spin}deg)`, opacity: 0 }
        ],
        { duration: reduce ? 1 : 750 + Math.random() * 400, easing: "cubic-bezier(.25,.6,.45,1)", fill: "forwards" }
      );
      a.onfinish = () => c.remove();
    }
  }
  function makeLantern(mini) {
    const l = document.createElement("div");
    l.className = "lantern" + (mini ? " mini" : "");
    l.innerHTML = '<div class="lan-body"></div>';
    return l;
  }

  /* ---------- 1. 签收 ---------- */
  const signBtn = $("#btn-sign"), stamp = $("#stamp"), mark = $(".mark");
  const keepEl = $("#keep"), keepN = $("#keep-n"), skipBtn = $("#btn-skip");
  function renderIntro() {
    $("#pm-small").textContent = state.signed === 0 ? "2026.9.25" : `第${state.signed + 1}次签收`;
    const n = state.wishes.length;
    keepN.textContent = n;
    keepEl.hidden = n === 0;
    skipBtn.hidden = state.signed === 0;
  }
  signBtn.addEventListener("click", () => {
    if (signBtn.disabled) return;
    signBtn.disabled = true;
    pickLines(state.signed === 0);
    state.signed += 1;
    save();
    stamp.classList.add("on");
    happy();
    if (!reduce) setTimeout(() => mark.animate(
      [{ transform: "scale(1)" }, { transform: "scale(.94) translateY(2px)", offset: 0.3 }, { transform: "scale(1.02)", offset: 0.65 }, { transform: "scale(1)" }],
      { duration: 360, easing: "ease-out" }
    ), 300);
    setTimeout(() => go("s-cake"), reduce ? 300 : 1050);
  });
  skipBtn.addEventListener("click", () => go("s-wish"));

  /* ---------- 2. 咬月饼 ---------- */
  const PREFIX = ["第一口甜甜的", "第二口软软的", "第三口满满的", "最后一口圆圆的"];
  const BLESS = [
    "祝你每天都有好心情",
    "祝你被这个世界温柔以待",
    "祝你的努力都有回响",
    "祝你所愿皆所得",
    "祝你的烦恼都像月饼渣一样被风吹走",
    "祝你被好运偷偷跟着",
    "祝你睡个好觉，做个甜甜的梦",
    "祝你遇到的难题都有答案",
    "祝你心里一直亮着一盏灯",
    "祝你每次抬头都有好天气",
    "祝你今天也被好好照顾着",
    "祝你的小心愿一个个实现",
    "祝你平平安安，健健康康",
    "祝你走过的路都算数",
    "祝你吃到的每一口都是喜欢的味道",
    "祝你熬过的夜都变成星星"
  ];
  let lines = PREFIX.map((p, i) => p + "，" + BLESS[i]);
  function pickLines(first) {
    let idx;
    if (first) idx = [0, 1, 2, 3];
    else {
      const last = new Set(state.lastLines || []);
      let pool = BLESS.map((_, i) => i).filter(i => !last.has(i));
      if (pool.length < 4) pool = BLESS.map((_, i) => i);
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      idx = pool.slice(0, 4);
    }
    state.lastLines = idx;
    lines = idx.map((b, i) => PREFIX[i] + "，" + BLESS[b]);
  }
  const HINTS = ["再咬一口？", "还剩一点点啦", "最后一口啦"];
  const BITE_DEG = [-40, 35, 165];
  const SVGNS = "http://www.w3.org/2000/svg";
  const cake = $("#cake"), cakeSvg = $("#cake-svg"), holes = $("#bite-holes");
  const hint = $("#cake-hint"), line = $("#wish-line"), paper = $("#paper"), openBtn = $("#btn-open");
  const dots = [...document.querySelectorAll("#dots i")];
  let bites = 0, busy = false, poof = null;

  function toClient(sx, sy) {
    const r = cakeSvg.getBoundingClientRect();
    return [r.left + (sx / 220) * r.width, r.top + (sy / 220) * r.height];
  }

      c.setAttribute("cx", (110 + D * Math.cos(a + o)).toFixed(2));
      c.setAttribute("cy", (110 + D * Math.sin(a + o)).toFixed(2));

      c.setAttribute("fill", "#000");

    });

        { transform: `translate(${dx}px,${dy}px) rotate(0deg) scale(${target.scale})`, opacity: endOpacity }
      ],
      { duration: reduce ? 800 : 5200, easing: "cubic-bezier(.35,.1,.4,1)", fill: "forwards" }
    );

  function bunnyHead() {

  /* 点小兔子：跳一下、脸红、冒爱心；连点会转圈圈 */
  let taps = [], sleeping = false, zzzT = null, spinning = false;
  function bunnyTap() {
    if (sleeping) { wakeUp(); return; }
    if (spinning) return;
    const now = Date.now();
    taps = taps.filter(t => now - t < 2600);
    taps.push(now);
    if (taps.length >= 6) { taps = []; spin(); return; }
    bunny.classList.add("blush");
    setTimeout(() => bunny.classList.remove("blush"), 900);
    happy();
    const [hx, hy] = bunnyHead();
    floatFx(Math.random() < 0.7 ? "♥" : "✦", hx + (Math.random() - 0.5) * 20, hy, { size: 14 + Math.random() * 6 });
    if (Math.random() < 0.45) {
      let i;
      do { i = Math.floor(Math.random() * LINES_TAP.length); } while (i === lastSay);
      lastSay = i;
      bunnySay(LINES_TAP[i]);
    }
  }
  function spin() {
    spinning = true;
    bunny.classList.add("happy", "blush");

    const [hx, hy] = bunnyHead();
    for (let i = 0; i < 10; i++) {
      const ang = (i / 10) * Math.PI * 2;
      floatFx(i % 2 ? "✦" : "✧", hx, hy + 14, {
        size: 12 + Math.random() * 8, color: i % 3 ? "var(--gold)" : "var(--accent)",
        dx: Math.cos(ang) * 60, dy: Math.sin(ang) * 46 - 20, dur: 1000
      });
    }
    bunnySvg.style.transformOrigin = "50% 60%";
    const a = reduce ? null : bunnySvg.animate(
      [
        { transform: "translateY(0) rotate(0deg) scale(1,1)" },
        { transform: "translateY(0) rotate(0deg) scale(1.1,.88)", offset: 0.12 },
        { transform: "translateY(-30px) rotate(180deg) scale(1,1)", offset: 0.5 },
        { transform: "translateY(0) rotate(360deg) scale(1.08,.92)", offset: 0.85 },
        { transform: "translateY(0) rotate(360deg) scale(1,1)" }
      ],
      { duration: 900, easing: "cubic-bezier(.35,.1,.3,1)" }
    );
    const done = () => { spinning = false; bunnySvg.style.transformOrigin = ""; bunny.classList.remove("happy", "blush"); };
    if (a) a.onfinish = done; else setTimeout(done, 600);
  }

  /* 长按小兔子：它会睡着；再点一下把它叫醒 */
  let pressT = null, pressAt = null, longFired = false, swallowUntil = 0;
  function sleepNow() {
    pressT = null;
    sleeping = true;
    longFired = true;
    bunny.classList.remove("happy", "blush", "blink");
    bunny.classList.add("sleep");
    bunnySay("困了……");
    const puff = () => {
      const [hx, hy] = bunnyHead();
      floatFx("z", hx - 8, hy - 8, { size: 13 + Math.random() * 7, color: "var(--ink-soft)", dx: -(18 + Math.random() * 10), dy: -50, dur: 1800 });
    };
    puff();
    zzzT = setInterval(puff, 1300);
  }
  function wakeUp() {
    sleeping = false;
    clearInterval(zzzT);
    bunny.classList.remove("sleep");
    bunnySay("我、我没睡！");
    if (!reduce) hop(22);
    const [hx, hy] = bunnyHead();
    floatFx("!", hx + 16, hy - 6, { size: 20, dx: 6, dy: -30, dur: 800 });
  }
  stage.addEventListener("pointerdown", e => {
    if (e.target.closest("button,input,label,.note,.sheet-wrap,.code-card,.recover,.mark,.bubble")) return;
    if (!onBunny(e.clientX, e.clientY) || sleeping) return;
    pressAt = [e.clientX, e.clientY];
    clearTimeout(pressT);
    pressT = setTimeout(sleepNow, 700);
  });
  const cancelPress = () => { clearTimeout(pressT); pressT = null; };
  stage.addEventListener("pointerup", () => {
    cancelPress();
    if (longFired) { longFired = false; swallowUntil = Date.now() + 450; }
  });
  stage.addEventListener("pointercancel", cancelPress);
  stage.addEventListener("pointermove", e => {
    if (pressT && pressAt && Math.hypot(e.clientX - pressAt[0], e.clientY - pressAt[1]) > 12) cancelPress();
  });
  stage.addEventListener("contextmenu", e => { if (onBunny(e.clientX, e.clientY)) e.preventDefault(); });

  /* 小兔子会自己眨眼 */
  (function blinkLoop() {
    setTimeout(() => {
      if (!sleeping && !document.hidden) {
        bunny.classList.add("blink");
        setTimeout(() => bunny.classList.remove("blink"), 150);
        if (Math.random() < 0.25) setTimeout(() => {
          bunny.classList.add("blink");
          setTimeout(() => bunny.classList.remove("blink"), 130);
        }, 280);
      }
      blinkLoop();
    }, 2800 + Math.random() * 3600);
  })();

  /* 点月亮：会晃一晃；连点三下，月亮会笑 */
  let moonTaps = [], smileT;
  function moonTap() {
    const now = Date.now();
    moonTaps = moonTaps.filter(t => now - t < 1600);
    moonTaps.push(now);
    if (!reduce) moon.animate(
      [
        { transform: "scale(1,1)" },
        { transform: "scale(1.07,.94)", offset: 0.25 },
        { transform: "scale(.97,1.04)", offset: 0.55 },
        { transform: "scale(1.01,.99)", offset: 0.8 },
        { transform: "scale(1,1)" }
      ],
      { duration: 560, easing: "ease-out" }
    );
    const m = moonCenter();
    floatFx("✦", m.x + (Math.random() - 0.5) * m.R, m.y - m.R * 0.6, { size: 12 + Math.random() * 6, color: "var(--gold)", dy: -34 });
    if (moonTaps.length >= 3) {
      moonTaps = [];
      moon.classList.add("smile");
      clearTimeout(smileT);
      smileT = setTimeout(() => moon.classList.remove("smile"), 3200);
    }
  }

  /* 点邮戳：再盖一次章 */
  mark.addEventListener("click", e => {
    e.stopPropagation();
    if (reduce) return;
    mark.animate(
      [
        { transform: "rotate(0deg) scale(1)" },
        { transform: "rotate(-8deg) scale(1.08)", offset: 0.3 },
        { transform: "rotate(5deg) scale(.96)", offset: 0.6 },
        { transform: "rotate(0deg) scale(1)" }
      ],
      { duration: 480, easing: "ease-out" }
    );
  });

  /* 点纸条上的胶带：想撕，撕不下来 */
  const tape = $("#tape");
  tape.addEventListener("click", e => {
    e.stopPropagation();
    if (reduce) return;
    tape.animate(
      [
        { transform: "translateX(-50%) rotate(-3deg)" },
        { transform: "translateX(-50%) translateY(-7px) rotate(-14deg)", offset: 0.3 },
        { transform: "translateX(-50%) translateY(-3px) rotate(3deg)", offset: 0.62 },
        { transform: "translateX(-50%) rotate(-4deg)", offset: 0.85 },
        { transform: "translateX(-50%) rotate(-3deg)" }
      ],
      { duration: 720, easing: "ease-out" }
    );
  });

  /* 偶尔划过一颗流星 */
  if (!reduce) {
    (function shootLoop() {
      setTimeout(() => {
        if (!document.hidden) {
          const el = document.createElement("span");
          el.className = "shoot";
          el.style.left = (45 + Math.random() * 45) + "%";
          el.style.top = (4 + Math.random() * 24) + "%";
          el.style.opacity = "0";
          fxBack.appendChild(el);
          const dist = 220 + Math.random() * 120;
          const a = el.animate(
            [
              { transform: "translate(0px,0px) rotate(155deg) scaleX(.3)", opacity: 0 },
              { transform: `translate(${-dist * 0.2}px,${dist * 0.09}px) rotate(155deg) scaleX(1)`, opacity: 1, offset: 0.18 },
              { transform: `translate(${-dist}px,${dist * 0.46}px) rotate(155deg) scaleX(.6)`, opacity: 0 }
            ],
            { duration: 1150, easing: "cubic-bezier(.3,.2,.3,1)" }
          );
          a.onfinish = () => el.remove();
        }
        shootLoop();
      }, 16000 + Math.random() * 22000);
    })();
  }

  /* 给小纸条里的每一行编号，用来一行一行展开 */
  [...document.querySelectorAll(".note > :not(.tape)")].forEach((el, i) => el.style.setProperty("--j", i));

  /* ---------- 启动：先显示本地，再和月亮同步 ---------- */
  renderIntro();
  (async () => {
    if (!CLOUD) return;
    if (state.code) {
      try {
        const res = await rpc("mrp_get_wishes", { p_code: state.code });
        if (res.ok) { merge(res.wishes); syncFailed = false; }
        else syncFailed = res.error !== "invalid_code";
      } catch (e) {
        syncFailed = true;
      }
    }
    try { await flush(); } catch (e) {}
    renderIntro();
    if (sWish.classList.contains("active")) {
      renderWish();
      if (state.showCode && state.code) showCodeCard();
    }
  })();
})();
</script>
</body>
</html>
